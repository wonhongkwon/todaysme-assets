<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:900px;background:#0d1117;font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.card{width:1200px;height:900px;padding:56px 72px 64px;display:flex;flex-direction:column}
.h{font-size:42px;font-weight:900;color:#f0f6fc;letter-spacing:-1.6px;margin-bottom:10px}
.sub{font-size:22px;font-weight:500;color:#7d8590;margin-bottom:34px}
.bars{display:flex;flex-direction:column;gap:20px}
.bar-row{display:flex;flex-direction:column;gap:8px}
.bar-label{display:flex;justify-content:space-between;font-size:26px;font-weight:700;color:#e6edf3}
.bar-label b{font-weight:900}
.bar-track{height:36px;background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px}
.foot{margin-top:32px;font-size:22px;font-weight:500;color:#7d8590;line-height:1.55;border-left:4px solid #30363d;padding-left:20px}
.foot b{color:#e6edf3;font-weight:700}
</style></head><body>
<div class="card">
  <div class="h">같은 재료, 다른 상승폭</div>
  <div class="sub">이번 주 상승률 (2026-08-24 기준)</div>
  <div class="bars">
    <div class="bar-row">
      <div class="bar-label"><span>리플</span><b style="color:#e05252">+48%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:100%;background:#e05252"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>이더리움</span><b style="color:#f0a830">+28%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:58%;background:#f0a830"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>솔라나</span><b style="color:#58a6ff">+24%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:50%;background:#58a6ff"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-label"><span>비트코인</span><b style="color:#7d8590">+20%</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:42%;background:#7d8590"></div></div>
    </div>
  </div>
  <div class="foot">리플이 가장 많이 오른 이유는 고유 호재가 아니라 <b>위치</b>입니다. 그동안 가장 뒤처져 있었고 하락 베팅도 가장 많이 쌓여 있었던 만큼, 매수세와 숏 청산이 리플에 먼저·크게 몰렸습니다.</div>
</div></body></html>

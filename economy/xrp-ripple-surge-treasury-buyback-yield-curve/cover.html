<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0d1117;font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.card{width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,#e05252 0%,#3fb950 100%)}
.eyebrow{font-size:26px;font-weight:700;color:#7d8590;letter-spacing:2px;margin-bottom:26px}
.q{font-size:78px;font-weight:900;color:#f0f6fc;letter-spacing:-3px;line-height:1.22}
.q em{font-style:normal;color:#e05252}
.rule{width:120px;height:5px;background:#30363d;margin:34px 0 30px}
.rows{display:flex;gap:56px}
.item .k{font-size:23px;font-weight:700;color:#7d8590;margin-bottom:10px}
.item .v{font-size:48px;font-weight:900;color:#e05252;letter-spacing:-1.5px;line-height:1}
.item .v.n{color:#7d8590;font-size:38px}
.item .s{font-size:21px;font-weight:500;color:#7d8590;margin-top:8px}
</style></head><body>
<div class="card">
  <div class="eyebrow">시장의 해석 vs 재무부의 설명</div>
  <div class="q">리플만 <em>48%</em> 뛴 이유,<br>재무부는 부인합니다</div>
  <div class="rule"></div>
  <div class="rows">
    <div class="item"><div class="k">같은 주 비트코인</div><div class="v n">+20%</div><div class="s">리플의 절반 이하</div></div>
    <div class="item"><div class="k">사상 최고가 대비</div><div class="v n">-60%</div><div class="s">여전히 낮은 자리</div></div>
  </div>
</div></body></html>

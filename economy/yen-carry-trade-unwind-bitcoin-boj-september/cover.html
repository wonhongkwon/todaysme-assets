<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0d1117;font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.card{width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,#e05252 0%,#f0a830 100%)}
.eyebrow{font-size:26px;font-weight:700;color:#7d8590;letter-spacing:2px;margin-bottom:26px}
.q{font-size:82px;font-weight:900;color:#f0f6fc;letter-spacing:-3px;line-height:1.2}
.q em{font-style:normal;color:#f0a830}
.rule{width:120px;height:5px;background:#30363d;margin:34px 0 30px}
.rows{display:flex;gap:56px}
.item .k{font-size:23px;font-weight:700;color:#7d8590;margin-bottom:10px}
.item .v{font-size:48px;font-weight:900;color:#e05252;letter-spacing:-1.5px;line-height:1}
.item .v.n{color:#58a6ff}
.item .s{font-size:21px;font-weight:500;color:#7d8590;margin-top:8px}
</style></head><body>
<div class="card">
  <div class="eyebrow">경제 용어</div>
  <div class="q">엔캐리 청산이란?<br><em>일본 금리</em>가 비트코인을 흔드는 이유</div>
  <div class="rule"></div>
  <div class="rows">
    <div class="item"><div class="k">2024년 8월 5일 비트코인</div><div class="v">-25%</div><div class="s">나흘 만에</div></div>
    <div class="item"><div class="k">다음 일본은행 회의</div><div class="v n">9월 17~18일</div><div class="s">인상 확률 70%대 후반</div></div>
  </div>
</div></body></html>

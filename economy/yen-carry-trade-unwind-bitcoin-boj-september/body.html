<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:880px;background:#0d1117;font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.card{width:1200px;height:880px;padding:56px 72px 64px;display:flex;flex-direction:column}
.h{font-size:44px;font-weight:900;color:#f0f6fc;letter-spacing:-1.6px;margin-bottom:10px}
.sub{font-size:22px;font-weight:500;color:#7d8590;margin-bottom:38px}
.flow{display:flex;flex-direction:column;gap:14px;flex:1}
.step{display:flex;align-items:center;gap:22px;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px 26px}
.step .n{flex:0 0 52px;height:52px;border-radius:50%;background:#21262d;color:#f0a830;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .t{font-size:30px;font-weight:700;color:#e6edf3;letter-spacing:-1px}
.step .t b{color:#e05252;font-weight:900}
.step.last{border-color:#e05252;background:#1c1416}
.step.last .n{background:#e05252;color:#fff}
.foot{margin-top:26px;font-size:22px;font-weight:500;color:#7d8590;line-height:1.55;border-left:4px solid #30363d;padding-left:20px}
.foot b{color:#e6edf3;font-weight:700}
</style></head><body>
<div class="card">
  <div class="h">엔캐리 청산은 이 순서로 진행됩니다</div>
  <div class="sub">일본 금리 인상이 비트코인 매도로 이어지는 경로</div>
  <div class="flow">
    <div class="step"><div class="n">1</div><div class="t">금리 0에 가까운 <b>엔화를 빌린다</b></div></div>
    <div class="step"><div class="n">2</div><div class="t">달러로 바꿔 미국 주식·채권·비트코인에 넣는다</div></div>
    <div class="step"><div class="n">3</div><div class="t">일본은행이 <b>금리를 올린다</b></div></div>
    <div class="step"><div class="n">4</div><div class="t">엔화가 비싸져 <b>환차손</b>, 이자 부담도 커진다</div></div>
    <div class="step last"><div class="n">5</div><div class="t">가진 자산을 <b>팔아서</b> 엔화를 되사 빚을 갚는다</div></div>
  </div>
  <div class="foot">5번 단계에서 파는 자산 목록에 <b>비트코인이 들어 있습니다.</b> 2024년 8월 5일에는 이 흐름이 하루에 몰리면서 비트코인이 6만 5,000달러대에서 4만 9,000달러까지 밀렸습니다.</div>
</div></body></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:1500px; overflow:hidden; }
  .card {
    position:relative;
    width:1200px; height:1500px;
    background: radial-gradient(120% 60% at 15% 0%, #141a26 0%, #0b0e14 45%, #0b0e14 100%);
    font-family:'Noto Sans KR', sans-serif;
    padding: 72px 76px 64px;
  }
  .kicker {
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:28px;
    color:#8a93a6;
    margin-bottom:20px;
  }
  .headline {
    font-weight:900; font-size:58px;
    line-height:1.3;
    color:#f5f7fa;
    letter-spacing:-0.02em;
    margin-bottom:40px;
  }
  .group-label {
    display:inline-flex; align-items:center; gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:28px;
    padding: 10px 24px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .group-label.blue { color:#0b0e14; background:#93c5fd; }
  .group-label.gold { color:#0b0e14; background:#fbbf24; margin-top:30px; }
  .rows { display:flex; flex-direction:column; gap:14px; }
  .row {
    display:flex; align-items:flex-start; gap:22px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-left:5px solid #93c5fd;
    border-radius:16px;
    padding: 22px 28px;
  }
  .row.gold { border-left-color:#fbbf24; }
  .tag {
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:24px;
    color:#e6e9ee;
    white-space:nowrap;
    min-width:190px;
  }
  .txt { font-size:25px; line-height:1.5; color:#c3cad6; font-weight:500; }
  .txt b { color:#fff; font-weight:800; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">두나무 지분 관계 · 확인 시점 기준</div>
    <div class="headline">지분 관계로 다시 본<br>클래리티법 관련주</div>

    <div class="group-label blue">우리기술투자</div>
    <div class="rows">
      <div class="row">
        <div class="tag">지분율</div>
        <div class="txt">두나무 지분 약 <b>7.6%</b> 보유(언론 확인)</div>
      </div>
      <div class="row">
        <div class="tag">별칭</div>
        <div class="txt">오랫동안 <b>"두나무 잭팟"</b> 관련주로 불려옴</div>
      </div>
    </div>

    <div class="group-label gold">지분은 계속 바뀐다</div>
    <div class="rows">
      <div class="row gold">
        <div class="tag">카카오 계열사</div>
        <div class="txt">보유하던 두나무 지분을 <b>한화투자증권에 매각</b></div>
      </div>
      <div class="row gold">
        <div class="tag">카카오페이</div>
        <div class="txt">지금은 직접적인 관련주로 보기 <b>어려움</b></div>
      </div>
    </div>

    <div class="group-label blue">리스티클의 함정</div>
    <div class="rows">
      <div class="row">
        <div class="tag">"관련주 15+"</div>
        <div class="txt">사업 연관성이 <b>교차 확인 안 된</b> 나열이 대부분</div>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:1500px; overflow:hidden; }
  .card {
    position:relative;
    width:1200px; height:1500px;
    background: radial-gradient(120% 60% at 15% 0%, #141a26 0%, #0b0e14 45%, #0b0e14 100%);
    font-family:'Noto Sans KR', sans-serif;
    padding: 72px 76px 64px;
  }
  .kicker {
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:28px;
    color:#8a93a6;
    margin-bottom:20px;
  }
  .headline {
    font-weight:900; font-size:60px;
    line-height:1.3;
    color:#f5f7fa;
    letter-spacing:-0.02em;
    margin-bottom:40px;
  }
  .group-label {
    display:inline-flex; align-items:center; gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:28px;
    padding: 10px 24px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .group-label.blue { color:#0b0e14; background:#93c5fd; }
  .group-label.gold { color:#0b0e14; background:#fbbf24; margin-top:30px; }
  .rows { display:flex; flex-direction:column; gap:14px; }
  .row {
    display:flex; align-items:flex-start; gap:22px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-left:5px solid #93c5fd;
    border-radius:16px;
    padding: 22px 28px;
  }
  .row.gold { border-left-color:#fbbf24; }
  .tag {
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:24px;
    color:#e6e9ee;
    white-space:nowrap;
    min-width:190px;
  }
  .txt { font-size:25px; line-height:1.5; color:#c3cad6; font-weight:500; }
  .txt b { color:#fff; font-weight:800; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">이더리움 기업 매수 · 8월 기준</div>
    <div class="headline">누가 이더리움을<br>쓸어담고 있나</div>

    <div class="group-label blue">비트마인 (1위)</div>
    <div class="rows">
      <div class="row">
        <div class="tag">보유량</div>
        <div class="txt">약 <b>582만 개</b>, 유통량의 <b>4.8%</b>(목표 5%의 96%)</div>
      </div>
      <div class="row">
        <div class="tag">전략</div>
        <div class="txt">"5%의 연금술" — 자체 스테이킹 플랫폼 MAVAN 운영</div>
      </div>
    </div>

    <div class="group-label gold">샤프링크 (2위)</div>
    <div class="rows">
      <div class="row gold">
        <div class="tag">보유량</div>
        <div class="txt">약 <b>88만9000개</b>(약 14억달러), "100% 스테이킹"</div>
      </div>
      <div class="row gold">
        <div class="tag">스테이킹 수익</div>
        <div class="txt">7개월간 <b>3300만달러</b> — 단, 평가손실도 큼</div>
      </div>
    </div>

    <div class="group-label blue">ETF 자금</div>
    <div class="rows">
      <div class="row">
        <div class="tag">현물 ETF</div>
        <div class="txt"><b>5주 연속</b> 순유입, 블랙록 ETHA가 약 80% 견인</div>
      </div>
    </div>
  </div>
</body>
</html>

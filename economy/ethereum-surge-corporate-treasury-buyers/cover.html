<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:1200px; overflow:hidden; }
  .card {
    position:relative;
    width:1200px; height:1200px;
    background: radial-gradient(120% 90% at 15% 0%, #141a26 0%, #0b0e14 55%, #0b0e14 100%);
    font-family:'Noto Sans KR', sans-serif;
  }
  .badge {
    position:absolute; top:72px; right:76px;
    display:inline-flex; align-items:center; gap:10px;
    background: rgba(147,197,253,0.12);
    border:1.5px solid rgba(147,197,253,0.5);
    color:#93c5fd;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:30px;
    padding: 14px 30px;
    border-radius:999px;
  }
  .kicker {
    position:absolute; top:270px; left:76px;
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:28px;
    color:#8a93a6;
    letter-spacing:0.01em;
  }
  .headline {
    position:absolute; top:326px; left:76px; right:76px;
    font-weight:900; font-size:76px;
    line-height:1.28;
    color:#f5f7fa;
    letter-spacing:-0.02em;
  }
  .headline .gold { color:#fbbf24; }
  .sub {
    position:absolute; top:606px; left:76px; right:76px;
    font-size:32px; font-weight:500;
    color:#aab2c3;
    line-height:1.5;
  }
  .stats {
    position:absolute; top:730px; left:76px; right:76px;
    display:flex; align-items:center; gap:26px;
  }
  .stat-card {
    flex:1;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:22px;
    padding: 30px 32px;
  }
  .stat-label {
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:24px;
    color:#8a93a6;
    margin-bottom:14px;
  }
  .stat-value {
    font-weight:900; font-size:56px;
    letter-spacing:-0.01em;
  }
  .stat-value.gold { color:#fbbf24; }
  .stat-value.blue { color:#93c5fd; }
  .stat-sub {
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:22px;
    color:#7d8592;
  }
  .arrow {
    font-size:40px; color:#5a6274; font-weight:700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">8월19일</div>
    <div class="kicker">오늘의 경제 · 이더리움 매수세</div>
    <div class="headline">이더리움이 비트코인보다<br><span class="gold">세 배 더 뛴 날</span></div>
    <div class="sub">그 뒤엔 유통량을 쓸어담은 두 기업이 있었습니다</div>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">이더리움 상승률</div>
        <div class="stat-value gold">+19%</div>
        <div class="stat-sub">1,920→2,282달러</div>
      </div>
      <div class="arrow">vs</div>
      <div class="stat-card">
        <div class="stat-label">비트코인 상승률</div>
        <div class="stat-value blue">+6%</div>
        <div class="stat-sub">같은 뉴스, 같은 하루</div>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:1600px; overflow:hidden; }
  .card {
    position:relative;
    width:1200px; height:1600px;
    background: radial-gradient(120% 60% at 15% 0%, #141a26 0%, #0b0e14 45%, #0b0e14 100%);
    font-family:'Noto Sans KR', sans-serif;
    padding: 72px 76px 64px;
  }
  .kicker {
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:28px;
    color:#8a93a6;
    margin-bottom:20px;
  }
  .headline {
    font-weight:900; font-size:58px;
    line-height:1.3;
    color:#f5f7fa;
    letter-spacing:-0.02em;
    margin-bottom:40px;
  }
  .group-label {
    display:inline-flex; align-items:center; gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:28px;
    padding: 10px 24px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .group-label.blue { color:#0b0e14; background:#93c5fd; }
  .group-label.gold { color:#0b0e14; background:#fbbf24; margin-top:30px; }
  .rows { display:flex; flex-direction:column; gap:14px; }
  .row {
    display:flex; align-items:flex-start; gap:22px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-left:5px solid #93c5fd;
    border-radius:16px;
    padding: 22px 28px;
  }
  .row.gold { border-left-color:#fbbf24; }
  .tag {
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:24px;
    color:#e6e9ee;
    white-space:nowrap;
    min-width:190px;
  }
  .txt { font-size:25px; line-height:1.5; color:#c3cad6; font-weight:500; }
  .txt b { color:#fff; font-weight:800; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">스테이블코인 3사 · 8월20일 오전</div>
    <div class="headline">숫자로 보는<br>오늘 급등 종목</div>

    <div class="group-label blue">주가 반응</div>
    <div class="rows">
      <div class="row">
        <div class="tag">다날</div>
        <div class="txt">5450원, <b>+17.33%</b></div>
      </div>
      <div class="row">
        <div class="tag">헥토파이낸셜</div>
        <div class="txt">2만1500원, <b>+15.90%</b></div>
      </div>
      <div class="row">
        <div class="tag">카카오페이</div>
        <div class="txt">4만5600원, <b>+10.55%</b></div>
      </div>
    </div>

    <div class="group-label gold">각자의 사업 근거</div>
    <div class="rows">
      <div class="row gold">
        <div class="tag">다날</div>
        <div class="txt">페이코인 기술 기반 발행·유통 추진</div>
      </div>
      <div class="row gold">
        <div class="tag">헥토파이낸셜</div>
        <div class="txt">글로벌 결제망+AI 에이전트 결제 확장</div>
      </div>
      <div class="row gold">
        <div class="tag">카카오페이</div>
        <div class="txt">서클과 원화 스테이블코인 인프라 구축</div>
      </div>
    </div>
  </div>
</body>
</html>

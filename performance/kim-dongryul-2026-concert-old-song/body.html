<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:700px;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
 background:linear-gradient(150deg,#0b0b0d,#17140f 60%,#0b0b0d);color:#fff;padding:46px 54px}
h2{font-size:46px;font-weight:900;letter-spacing:-2px;margin-bottom:8px}
.lead{font-size:26px;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:30px}
.cols{display:flex;gap:22px;align-items:stretch}
.col{flex:1;border-radius:20px;padding:26px 26px 24px}
.a{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.13)}
.b{background:rgba(216,162,90,.12);border:2px solid #d8a25a}
.col .h{font-size:25px;font-weight:800;margin-bottom:6px}
.a .h{color:rgba(255,255,255,.65)}
.b .h{color:#d8a25a}
.col .t{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-bottom:18px;line-height:1.25}
.item{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:600;color:rgba(255,255,255,.86);margin-bottom:11px}
.dot{width:11px;height:11px;border-radius:50%;background:#d8a25a;flex:none}
.dot.off{background:rgba(255,255,255,.18)}
.strike{color:rgba(255,255,255,.32);text-decoration:line-through}
.foot{margin-top:26px;display:flex;gap:18px}
.f{flex:1;background:rgba(255,255,255,.05);border-radius:16px;padding:20px 22px}
.f .k{font-size:22px;font-weight:700;color:#d8a25a;margin-bottom:6px}
.f .v{font-size:31px;font-weight:900;letter-spacing:-1px}
</style>
<h2>무대에서 무엇이 빠지고 무엇이 남는가</h2>
<div class="lead">전람회 시절을 포함해 처음 있는 편성 변화입니다</div>
<div class="cols">
  <div class="col a">
    <div class="h">지금까지의 공연</div>
    <div class="t">오케스트라 + 밴드</div>
    <div class="item"><span class="dot off"></span>현악·관악 대편성</div>
    <div class="item"><span class="dot off"></span>대곡 위주 편곡</div>
    <div class="item"><span class="dot off"></span>대표곡 중심 선곡</div>
    <div class="item"><span class="dot off"></span>연주자로 꽉 찬 무대</div>
  </div>
  <div class="col b">
    <div class="h">이번 '오래된 노래'</div>
    <div class="t">밴드 '율밴'만</div>
    <div class="item"><span class="dot"></span><span class="strike">현악·관악 대편성</span></div>
    <div class="item"><span class="dot"></span>기본 밴드 편곡과 목소리</div>
    <div class="item"><span class="dot"></span>소품 스타일 숨은 곡</div>
    <div class="item"><span class="dot"></span>빈 자리를 쓰는 무대 연출</div>
  </div>
</div>
<div class="foot">
  <div class="f"><div class="k">공연</div><div class="v">10월 17~25일 7회</div></div>
  <div class="f"><div class="k">장소</div><div class="v">세종문화회관 대극장</div></div>
  <div class="f"><div class="k">예매</div><div class="v">9월 4일 오후 5시</div></div>
</div>

<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#050505;position:relative}
.bg{position:absolute;inset:0;background:url('stage.jpg') center 62%/cover no-repeat;filter:brightness(.9) contrast(1.05)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.97) 0%,rgba(5,5,5,.86) 38%,rgba(5,5,5,.30) 66%,rgba(5,5,5,.55) 100%)}
.wrap{position:absolute;inset:0;padding:56px 62px}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:6px;color:#d8a25a;margin-bottom:20px}
h1{font-size:82px;font-weight:900;line-height:1.12;letter-spacing:-3.5px;color:#fff}
h1 span{color:#d8a25a}
.line{width:88px;height:5px;background:#d8a25a;margin:26px 0 20px;border-radius:3px}
.sub{font-size:29px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.5}
.chairs{position:absolute;right:60px;bottom:38px;text-align:right}
.chairs .b{font-size:22px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:1px}
</style>
<div class="bg"></div><div class="veil"></div>
<div class="wrap">
  <div class="eyebrow">2026 · 오래된 노래</div>
  <h1>비워 둔 자리에서<br><span>무엇이 들릴까요</span></h1>
  <div class="line"></div>
  <div class="sub">김동률이 데뷔 이후 처음으로 오케스트라 없이 무대에 섭니다</div>
</div>
<div class="chairs"><div class="b">10월 · 세종문화회관 대극장 · 7회</div></div>
